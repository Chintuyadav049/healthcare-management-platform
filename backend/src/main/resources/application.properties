# Spring Application Config
spring.application.name=healthcare-management

# Server Config
server.port=8080
server.servlet.context-path=/

# H2 Database Configurations
spring.datasource.url=jdbc:h2:mem:healthcare_management;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Logging Settings
logging.level.org.springframework.security=INFO
logging.level.com.healthcare.management=DEBUG

# JWT Configurations
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970337336763979244226452948404D6351}
jwt.expiration-ms=86400000
