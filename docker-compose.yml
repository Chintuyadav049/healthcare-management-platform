version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: healthcare-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: healthcare_management
      MYSQL_USER: healthcare_user
      MYSQL_PASSWORD: healthcare_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - healthcare-network

volumes:
  mysql_data:

networks:
  healthcare-network:
    driver: bridge
